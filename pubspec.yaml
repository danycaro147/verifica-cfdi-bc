name: verifica_cfdi
description: Verifica CFDI — consulta el estatus de facturas en el SAT y la lista 69-B. Por BrainCode México Tech.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  mobile_scanner: '>=6.0.0 <9.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/efos/
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
    - family: ArchivoExpanded
      fonts:
        - asset: assets/fonts/ArchivoExpanded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ArchivoExpanded-ExtraBold.ttf
          weight: 800
    - family: PlexMono
      fonts:
        - asset: assets/fonts/PlexMono-Regular.ttf
        - asset: assets/fonts/PlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlexMono-SemiBold.ttf
          weight: 600
